<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Iconography</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--cream-100);font-family:var(--font-sans);}
  .wrap{padding:22px 28px;display:grid;grid-template-columns:repeat(6,1fr);gap:14px;align-items:flex-start;}
  .cell{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--cream-50);}
  .cell i{width:24px;height:24px;color:var(--ink-800);}
  .lab{font-family:var(--font-mono);font-size:10px;color:var(--fg-subtle);}
  .rune{font-family:var(--font-runic);font-size:22px;color:var(--muninn-700);}
</style>
</head><body>
<div class="wrap">
  <div class="cell"><i data-lucide="sparkles"></i><div class="lab">sparkles</div></div>
  <div class="cell"><i data-lucide="brain"></i><div class="lab">brain</div></div>
  <div class="cell"><i data-lucide="book-open"></i><div class="lab">book-open</div></div>
  <div class="cell"><i data-lucide="search"></i><div class="lab">search</div></div>
  <div class="cell"><i data-lucide="feather"></i><div class="lab">feather</div></div>
  <div class="cell"><i data-lucide="archive"></i><div class="lab">archive</div></div>
  <div class="cell"><i data-lucide="arrow-up-right"></i><div class="lab">arrow↗</div></div>
  <div class="cell"><i data-lucide="message-square"></i><div class="lab">chat</div></div>
  <div class="cell"><img src="../assets/pixel-crow-huginn.svg" width="22" style="image-rendering:pixelated"><div class="lab">px-huginn</div></div>
  <div class="cell"><img src="../assets/pixel-crow-muninn.svg" width="22" style="image-rendering:pixelated"><div class="lab">px-muninn</div></div>
  <div class="cell"><span class="rune">ᚺ</span><div class="lab">rune-H</div></div>
  <div class="cell"><span class="rune">ᛗ</span><div class="lab">rune-M</div></div>
</div>
<script src="https://unpkg.com/lucide@latest"></script>
<script>lucide.createIcons();</script>
</body></html>
