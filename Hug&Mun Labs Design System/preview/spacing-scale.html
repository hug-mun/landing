<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Spacing</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--cream-100);font-family:var(--font-sans);}
  .wrap{padding:22px 28px;display:flex;gap:14px;align-items:flex-end;}
  .col{display:flex;flex-direction:column;align-items:center;gap:6px;}
  .bar{background:var(--muninn-700);border-radius:2px;width:40px;}
  .tok{font-family:var(--font-mono);font-size:10px;color:var(--fg-muted);}
  .v{font-family:var(--font-mono);font-size:10px;color:var(--fg-subtle);}
</style>
</head><body>
<div class="wrap">
  <div class="col"><div class="bar" style="height:4px"></div><div class="tok">--sp-1</div><div class="v">4</div></div>
  <div class="col"><div class="bar" style="height:8px"></div><div class="tok">--sp-2</div><div class="v">8</div></div>
  <div class="col"><div class="bar" style="height:12px"></div><div class="tok">--sp-3</div><div class="v">12</div></div>
  <div class="col"><div class="bar" style="height:16px"></div><div class="tok">--sp-4</div><div class="v">16</div></div>
  <div class="col"><div class="bar" style="height:24px"></div><div class="tok">--sp-5</div><div class="v">24</div></div>
  <div class="col"><div class="bar" style="height:32px"></div><div class="tok">--sp-6</div><div class="v">32</div></div>
  <div class="col"><div class="bar" style="height:48px"></div><div class="tok">--sp-7</div><div class="v">48</div></div>
  <div class="col"><div class="bar" style="height:64px"></div><div class="tok">--sp-8</div><div class="v">64</div></div>
  <div class="col"><div class="bar" style="height:96px"></div><div class="tok">--sp-9</div><div class="v">96</div></div>
</div>
</body></html>
