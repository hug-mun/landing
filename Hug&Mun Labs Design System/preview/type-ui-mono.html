<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Type — UI & code</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--cream-100);}
  .wrap{padding:22px 28px;display:grid;grid-template-columns:1fr 1fr;gap:22px;}
  .col{display:flex;flex-direction:column;gap:10px;}
  .eyebrow{font-family:var(--font-sans);font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-subtle);}
  .btn{font-family:var(--font-sans);font-size:14px;font-weight:600;}
  .cap{font-family:var(--font-sans);font-size:12px;color:var(--fg-muted);}
  .code{font-family:var(--font-mono);font-size:13px;background:var(--cream-200);padding:10px 12px;border-radius:var(--r-md);color:var(--ink-800);}
  .meta{font-family:var(--font-mono);font-size:10px;color:var(--fg-subtle);letter-spacing:.05em;}
  .runic{font-family:var(--font-runic);font-size:20px;color:var(--ink-600);letter-spacing:.3em;}
</style>
</head><body>
<div class="wrap">
  <div class="col">
    <div class="eyebrow">Research · paper 003</div>
    <div class="btn">Continue reading →</div>
    <div class="cap">Last updated two hours ago</div>
    <div class="meta">Inter · 12 / 14 / 12</div>
  </div>
  <div class="col">
    <div class="code">const raven = new Model("hugr-1.2");</div>
    <div class="runic">ᚺ ᛫ ᛗ ᛫ ᚢ</div>
    <div class="meta">JetBrains Mono · Noto Sans Runic</div>
  </div>
</div>
</body></html>
