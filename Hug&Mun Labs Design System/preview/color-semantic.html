<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Semantic colors</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--cream-100);height:100%;font-family:var(--font-sans);}
  .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:18px;height:100%;box-sizing:border-box;}
  .tok{border:1px solid var(--border);border-radius:var(--r-md);padding:10px 12px;background:var(--cream-50);display:flex;flex-direction:column;justify-content:space-between;min-height:0;}
  .row{display:flex;align-items:center;gap:8px;}
  .dot{width:14px;height:14px;border-radius:4px;border:1px solid rgba(0,0,0,.1);}
  .n{font-size:11px;font-weight:600;color:var(--ink-900);}
  .v{font-family:var(--font-mono);font-size:10px;color:var(--ink-600);letter-spacing:.03em;}
  .role{font-size:10px;color:var(--fg-subtle);letter-spacing:.1em;text-transform:uppercase;font-weight:600;}
</style>
</head><body>
<div class="wrap">
  <div class="tok"><div class="role">brand</div><div class="row"><span class="dot" style="background:#3F1F73"></span><span class="n">--brand</span></div><div class="v">muninn-700</div></div>
  <div class="tok"><div class="role">accent</div><div class="row"><span class="dot" style="background:#8E1C24"></span><span class="n">--accent</span></div><div class="v">huginn-700</div></div>
  <div class="tok"><div class="role">bg</div><div class="row"><span class="dot" style="background:#F5EEDC"></span><span class="n">--bg</span></div><div class="v">cream-100</div></div>
  <div class="tok"><div class="role">fg</div><div class="row"><span class="dot" style="background:#2E2018"></span><span class="n">--fg</span></div><div class="v">ink-800</div></div>

  <div class="tok"><div class="role">border</div><div class="row"><span class="dot" style="background:#E0D3B5"></span><span class="n">--border</span></div><div class="v">cream-300</div></div>
  <div class="tok"><div class="role">success</div><div class="row"><span class="dot" style="background:#4A6B3A"></span><span class="n">--success</span></div><div class="v">#4A6B3A</div></div>
  <div class="tok"><div class="role">warning</div><div class="row"><span class="dot" style="background:#B3720F"></span><span class="n">--warning</span></div><div class="v">#B3720F</div></div>
  <div class="tok"><div class="role">danger</div><div class="row"><span class="dot" style="background:#8E1C24"></span><span class="n">--danger</span></div><div class="v">huginn-700</div></div>
</div>
</body></html>
