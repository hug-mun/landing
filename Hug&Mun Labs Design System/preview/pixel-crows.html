<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Pixel crows</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--cream-100);height:100%;}
  .wrap{display:flex;gap:24px;align-items:center;justify-content:center;padding:24px;height:100%;box-sizing:border-box;}
  .cell{flex:1;display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px;border:1px solid var(--border);border-radius:var(--r-lg);background:var(--cream-50);}
  .pxrow{display:flex;align-items:center;gap:20px;}
  .pxrow img{image-rendering:pixelated;}
  .big{width:96px;height:96px;}
  .med{width:48px;height:48px;}
  .sm{width:24px;height:24px;}
  .lab{font-family:var(--font-sans);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-subtle);}
</style>
</head><body>
<div class="wrap">
  <div class="cell">
    <div class="pxrow">
      <img class="big" src="../assets/pixel-crow-huginn.svg">
      <img class="med" src="../assets/pixel-crow-huginn.svg">
      <img class="sm"  src="../assets/pixel-crow-huginn.svg">
    </div>
    <div class="lab">Pixel Huginn · 16px native</div>
  </div>
  <div class="cell">
    <div class="pxrow">
      <img class="big" src="../assets/pixel-crow-muninn.svg">
      <img class="med" src="../assets/pixel-crow-muninn.svg">
      <img class="sm"  src="../assets/pixel-crow-muninn.svg">
    </div>
    <div class="lab">Pixel Muninn · 16px native</div>
  </div>
</div>
</body></html>
