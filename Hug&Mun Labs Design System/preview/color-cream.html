<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Cream palette</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--cream-100);height:100%;}
  .wrap{display:flex;gap:12px;padding:20px;height:100%;box-sizing:border-box;}
  .sw{flex:1;display:flex;flex-direction:column;justify-content:space-between;padding:14px;border:1px solid rgba(46,32,24,.08);border-radius:var(--r-md);min-height:160px;}
  .name{font-family:var(--font-sans);font-size:12px;font-weight:600;color:var(--ink-900);}
  .hex{font-family:var(--font-mono);font-size:10px;color:var(--ink-700);text-transform:uppercase;letter-spacing:.05em;}
</style>
</head><body>
<div class="wrap">
  <div class="sw" style="background:#FBF6EC;"><div class="name">cream-50</div><div class="hex">#FBF6EC</div></div>
  <div class="sw" style="background:#F5EEDC;"><div class="name">cream-100</div><div class="hex">#F5EEDC</div></div>
  <div class="sw" style="background:#EDE3CC;"><div class="name">cream-200</div><div class="hex">#EDE3CC</div></div>
  <div class="sw" style="background:#E0D3B5;"><div class="name">cream-300</div><div class="hex">#E0D3B5</div></div>
  <div class="sw" style="background:#C9B994;"><div class="name">cream-400</div><div class="hex">#C9B994</div></div>
</div>
</body></html>
