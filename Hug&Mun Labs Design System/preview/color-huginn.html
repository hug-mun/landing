<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Huginn — thought · red</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--cream-100);height:100%;}
  .wrap{display:flex;gap:8px;padding:20px;height:100%;box-sizing:border-box;}
  .sw{flex:1;display:flex;flex-direction:column;justify-content:space-between;padding:12px;border-radius:var(--r-md);min-height:160px;}
  .dark{color:#FBF6EC;} .light{color:#4A0E12;}
  .name{font-family:var(--font-sans);font-size:11px;font-weight:600;}
  .hex{font-family:var(--font-mono);font-size:9px;text-transform:uppercase;letter-spacing:.05em;opacity:.9;}
</style>
</head><body>
<div class="wrap">
  <div class="sw dark"  style="background:#4A0E12;"><div class="name">900</div><div class="hex">#4A0E12</div></div>
  <div class="sw dark"  style="background:#6B1218;"><div class="name">800</div><div class="hex">#6B1218</div></div>
  <div class="sw dark"  style="background:#8E1C24;"><div class="name">700 ★</div><div class="hex">#8E1C24</div></div>
  <div class="sw dark"  style="background:#B3262F;"><div class="name">600</div><div class="hex">#B3262F</div></div>
  <div class="sw dark"  style="background:#D13640;"><div class="name">500</div><div class="hex">#D13640</div></div>
  <div class="sw light" style="background:#E26770;"><div class="name">400</div><div class="hex">#E26770</div></div>
  <div class="sw light" style="background:#EE9EA4;"><div class="name">300</div><div class="hex">#EE9EA4</div></div>
  <div class="sw light" style="background:#F6D0D3;"><div class="name">200</div><div class="hex">#F6D0D3</div></div>
  <div class="sw light" style="background:#FBE8EA;"><div class="name">100</div><div class="hex">#FBE8EA</div></div>
</div>
</body></html>
