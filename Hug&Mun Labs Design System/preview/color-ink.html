<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Ink palette</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--cream-100);height:100%;}
  .wrap{display:flex;gap:12px;padding:20px;height:100%;box-sizing:border-box;}
  .sw{flex:1;display:flex;flex-direction:column;justify-content:space-between;padding:14px;border-radius:var(--r-md);min-height:160px;color:#FBF6EC;}
  .sw.light{color:#1F1510;}
  .name{font-family:var(--font-sans);font-size:12px;font-weight:600;}
  .hex{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.05em;opacity:.85;}
</style>
</head><body>
<div class="wrap">
  <div class="sw" style="background:#1F1510;"><div class="name">ink-900</div><div class="hex">#1F1510</div></div>
  <div class="sw" style="background:#2E2018;"><div class="name">ink-800</div><div class="hex">#2E2018</div></div>
  <div class="sw" style="background:#4A3527;"><div class="name">ink-700</div><div class="hex">#4A3527</div></div>
  <div class="sw" style="background:#6B4E39;"><div class="name">ink-600</div><div class="hex">#6B4E39</div></div>
  <div class="sw" style="background:#8B6B4F;"><div class="name">ink-500</div><div class="hex">#8B6B4F</div></div>
  <div class="sw light" style="background:#A88868;"><div class="name">ink-400</div><div class="hex">#A88868</div></div>
</div>
</body></html>
