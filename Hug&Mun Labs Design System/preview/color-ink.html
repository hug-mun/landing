<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Ink palette</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--cream-100);height:100%;}
  .wrap{display:flex;gap:12px;padding:20px;height:100%;box-sizing:border-box;}
  .sw{flex:1;display:flex;flex-direction:column;justify-content:space-between;padding:14px;border-radius:var(--r-md);min-height:160px;color:#FBF6EC;}
  .sw.light{color:#1F1510;}
  .name{font-family:var(--font-sans);font-size:12px;font-weight:600;}
  .hex{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.05em;opacity:.85;}
</style>
</head><body>
<div class="wrap">
  <div class="sw" style="background:#141414;"><div class="name">ink-900</div><div class="hex">#141414</div></div>
  <div class="sw" style="background:#222222;"><div class="name">ink-800</div><div class="hex">#222222</div></div>
  <div class="sw" style="background:#444444;"><div class="name">ink-700</div><div class="hex">#444444</div></div>
  <div class="sw" style="background:#666666;"><div class="name">ink-600</div><div class="hex">#666666</div></div>
  <div class="sw" style="background:#888888;"><div class="name">ink-500</div><div class="hex">#888888</div></div>
  <div class="sw light" style="background:#AAAAAA;"><div class="name">ink-400</div><div class="hex">#AAAAAA</div></div>
</div>
</body></html>
