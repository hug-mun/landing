<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Type scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--cream-100);}
  table{width:100%;border-collapse:collapse;margin:18px 24px;}
  td{padding:4px 10px;vertical-align:baseline;border-bottom:1px dashed var(--border);}
  .tok{font-family:var(--font-mono);font-size:11px;color:var(--fg-muted);width:90px;}
  .px{font-family:var(--font-mono);font-size:10px;color:var(--fg-subtle);width:60px;}
  .sp{font-family:var(--font-display);color:var(--ink-900);line-height:1;font-weight:600;}
</style>
</head><body>
<table>
  <tr><td class="tok">--fs-6xl</td><td class="px">76px</td><td class="sp" style="font-size:54px">Aa</td></tr>
  <tr><td class="tok">--fs-4xl</td><td class="px">48px</td><td class="sp" style="font-size:36px">Aa Bb</td></tr>
  <tr><td class="tok">--fs-2xl</td><td class="px">30px</td><td class="sp" style="font-size:24px">Thought</td></tr>
  <tr><td class="tok">--fs-lg</td><td class="px">20px</td><td class="sp" style="font-size:18px;font-family:var(--font-serif)">Two ravens, one mind</td></tr>
  <tr><td class="tok">--fs-base</td><td class="px">16px</td><td class="sp" style="font-size:14px;font-family:var(--font-serif);font-weight:400">Memory is what remembers yesterday.</td></tr>
</table>
</body></html>
