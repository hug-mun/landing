<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Radii</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--cream-100);font-family:var(--font-sans);}
  .wrap{display:flex;gap:18px;align-items:center;justify-content:center;padding:22px;height:100%;box-sizing:border-box;}
  .cell{display:flex;flex-direction:column;align-items:center;gap:8px;}
  .box{width:72px;height:72px;background:var(--cream-50);border:1px solid var(--border-strong);}
  .tok{font-family:var(--font-mono);font-size:11px;color:var(--fg-muted);}
  .v{font-family:var(--font-mono);font-size:10px;color:var(--fg-subtle);}
</style>
</head><body>
<div class="wrap">
  <div class="cell"><div class="box" style="border-radius:0"></div><div class="tok">--r-none</div><div class="v">0</div></div>
  <div class="cell"><div class="box" style="border-radius:2px"></div><div class="tok">--r-sm</div><div class="v">2</div></div>
  <div class="cell"><div class="box" style="border-radius:4px"></div><div class="tok">--r-md ★</div><div class="v">4</div></div>
  <div class="cell"><div class="box" style="border-radius:8px"></div><div class="tok">--r-lg</div><div class="v">8</div></div>
  <div class="cell"><div class="box" style="border-radius:12px"></div><div class="tok">--r-xl</div><div class="v">12</div></div>
  <div class="cell"><div class="box" style="border-radius:16px"></div><div class="tok">--r-2xl</div><div class="v">16</div></div>
  <div class="cell"><div class="box" style="border-radius:999px"></div><div class="tok">--r-pill</div><div class="v">∞</div></div>
</div>
</body></html>
