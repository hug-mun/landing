<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Buttons</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--cream-100);}
  .wrap{padding:24px 28px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;}
  .btn{font-family:var(--font-sans);font-weight:600;font-size:14px;padding:10px 18px;border-radius:var(--r-md);cursor:pointer;border:1px solid transparent;transition:all 120ms var(--ease-out);display:inline-flex;align-items:center;gap:8px;}
  .btn-primary{background:var(--muninn-700);color:var(--cream-50);}
  .btn-primary:hover{background:var(--muninn-800);}
  .btn-accent{background:var(--huginn-700);color:var(--cream-50);}
  .btn-accent:hover{background:var(--huginn-800);}
  .btn-secondary{background:var(--cream-50);color:var(--ink-900);border-color:var(--border-strong);}
  .btn-secondary:hover{background:var(--cream-200);}
  .btn-ghost{background:transparent;color:var(--muninn-700);}
  .btn-ghost:hover{background:var(--muninn-100);}
  .btn-ink{background:var(--ink-900);color:var(--cream-50);}
  .btn-sm{font-size:12px;padding:6px 12px;}
  .btn-lg{font-size:15px;padding:13px 22px;}
</style>
</head><body>
<div class="wrap">
  <button class="btn btn-primary">Start thinking</button>
  <button class="btn btn-accent">Publish paper</button>
  <button class="btn btn-secondary">Cancel</button>
  <button class="btn btn-ghost">Learn more →</button>
  <button class="btn btn-ink">Sign in</button>
  <button class="btn btn-primary btn-sm">Save</button>
  <button class="btn btn-primary btn-lg">Request access</button>
</div>
</body></html>
