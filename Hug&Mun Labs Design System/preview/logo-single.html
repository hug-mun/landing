<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Logo — single marks</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--cream-100);height:100%;}
  .wrap{display:flex;gap:24px;align-items:center;justify-content:center;padding:24px;height:100%;box-sizing:border-box;}
  .cell{flex:1;display:flex;flex-direction:column;align-items:center;gap:12px;padding:20px;border:1px solid var(--border);border-radius:var(--r-lg);background:var(--cream-50);}
  .cell img{height:90px;}
  h4{margin:0;font-family:var(--font-display);color:var(--ink-900);}
  .sub{font-family:var(--font-serif);color:var(--fg-muted);font-size:13px;font-style:italic;}
  .lab{font-family:var(--font-sans);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-subtle);}
</style>
</head><body>
<div class="wrap">
  <div class="cell">
    <img src="../assets/logo-huginn.svg" alt="">
    <h4>Huginn</h4>
    <div class="sub">thought · reasoning</div>
    <div class="lab">#8E1C24 · huginn-700</div>
  </div>
  <div class="cell">
    <img src="../assets/logo-muninn.svg" alt="">
    <h4>Muninn</h4>
    <div class="sub">memory · depth</div>
    <div class="lab">#3F1F73 · muninn-700</div>
  </div>
</div>
</body></html>
