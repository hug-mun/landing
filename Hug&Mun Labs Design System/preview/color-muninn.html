<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Muninn — memory · purple</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--cream-100);height:100%;}
  .wrap{display:flex;gap:8px;padding:20px;height:100%;box-sizing:border-box;}
  .sw{flex:1;display:flex;flex-direction:column;justify-content:space-between;padding:12px;border-radius:var(--r-md);min-height:160px;}
  .dark{color:#FBF6EC;} .light{color:#1E0E3A;}
  .name{font-family:var(--font-sans);font-size:11px;font-weight:600;}
  .hex{font-family:var(--font-mono);font-size:9px;text-transform:uppercase;letter-spacing:.05em;opacity:.9;}
</style>
</head><body>
<div class="wrap">
  <div class="sw dark"  style="background:#1E0E3A;"><div class="name">900</div><div class="hex">#1E0E3A</div></div>
  <div class="sw dark"  style="background:#2D1654;"><div class="name">800</div><div class="hex">#2D1654</div></div>
  <div class="sw dark"  style="background:#3F1F73;"><div class="name">700 ★</div><div class="hex">#3F1F73</div></div>
  <div class="sw dark"  style="background:#5A2EA0;"><div class="name">600</div><div class="hex">#5A2EA0</div></div>
  <div class="sw dark"  style="background:#7A47C9;"><div class="name">500</div><div class="hex">#7A47C9</div></div>
  <div class="sw light" style="background:#A074E0;"><div class="name">400</div><div class="hex">#A074E0</div></div>
  <div class="sw light" style="background:#C9ACEF;"><div class="name">300</div><div class="hex">#C9ACEF</div></div>
  <div class="sw light" style="background:#E5D5F7;"><div class="name">200</div><div class="hex">#E5D5F7</div></div>
  <div class="sw light" style="background:#F1E7FA;"><div class="name">100</div><div class="hex">#F1E7FA</div></div>
</div>
</body></html>
