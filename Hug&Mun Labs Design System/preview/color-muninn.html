<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Muninn — memory</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--cream-100);height:100%;}
  .wrap{display:flex;gap:8px;padding:20px;height:100%;box-sizing:border-box;}
  .sw{flex:1;display:flex;flex-direction:column;justify-content:space-between;padding:12px;border-radius:var(--r-md);min-height:160px;}
  .dark{color:#FBF6EC;} .light{color:#4A0E12;}
  .name{font-family:var(--font-sans);font-size:11px;font-weight:600;}
  .hex{font-family:var(--font-mono);font-size:9px;text-transform:uppercase;letter-spacing:.05em;opacity:.9;}
</style>
</head><body>
<div class="wrap">
  <div class="sw dark"  style="background:var(--muninn-900);"><div class="name">900</div><div class="hex">muninn-900</div></div>
  <div class="sw dark"  style="background:var(--muninn-800);"><div class="name">800</div><div class="hex">muninn-800</div></div>
  <div class="sw dark"  style="background:var(--muninn-700);"><div class="name">700 ★</div><div class="hex">muninn-700</div></div>
  <div class="sw dark"  style="background:var(--muninn-600);"><div class="name">600</div><div class="hex">muninn-600</div></div>
  <div class="sw dark"  style="background:var(--muninn-500);"><div class="name">500</div><div class="hex">muninn-500</div></div>
  <div class="sw light" style="background:var(--muninn-400);"><div class="name">400</div><div class="hex">muninn-400</div></div>
  <div class="sw light" style="background:var(--muninn-300);"><div class="name">300</div><div class="hex">muninn-300</div></div>
  <div class="sw light" style="background:var(--muninn-200);"><div class="name">200</div><div class="hex">muninn-200</div></div>
  <div class="sw light" style="background:var(--muninn-100);"><div class="name">100</div><div class="hex">muninn-100</div></div>
</div>
</body></html>
