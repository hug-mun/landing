<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Dividers & runes</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--cream-100);font-family:var(--font-serif);color:var(--ink-800);}
  .wrap{padding:20px 32px;}
  .section{margin-bottom:14px;}
  hr{border:none;border-top:1px solid var(--border);margin:14px 0;}
  .rune-div{display:flex;align-items:center;gap:14px;color:var(--ink-400);margin:14px 0;}
  .rune-div::before,.rune-div::after{content:"";flex:1;height:1px;background:var(--border);}
  .rune-div .glyphs{font-family:var(--font-runic);letter-spacing:.4em;font-size:14px;color:var(--ink-500);}
  .cap{font-family:var(--font-sans);font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-subtle);}
  .para{font-size:14px;line-height:1.6;max-width:60ch;}
</style>
</head><body>
<div class="wrap">
  <div class="cap">Plain hairline</div>
  <hr>
  <div class="cap">Runic divider</div>
  <div class="rune-div"><span class="glyphs">ᚺ ᛫ ᛗ</span></div>
  <p class="para">The ravens fly out at dawn and return by dusk. What they carry is not news — it is a question reframed.</p>
</div>
</body></html>
