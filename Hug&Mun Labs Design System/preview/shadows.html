<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Shadows</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--cream-100);font-family:var(--font-sans);}
  .wrap{display:flex;gap:26px;align-items:center;justify-content:center;padding:32px 24px;height:100%;box-sizing:border-box;}
  .cell{display:flex;flex-direction:column;align-items:center;gap:10px;}
  .box{width:88px;height:66px;background:var(--cream-50);border-radius:var(--r-lg);border:1px solid var(--border);}
  .tok{font-family:var(--font-mono);font-size:10px;color:var(--fg-muted);}
  .note{font-size:10px;color:var(--fg-subtle);}
</style>
</head><body>
<div class="wrap">
  <div class="cell"><div class="box" style="box-shadow:var(--shadow-xs)"></div><div class="tok">--shadow-xs</div><div class="note">hairline</div></div>
  <div class="cell"><div class="box" style="box-shadow:var(--shadow-sm)"></div><div class="tok">--shadow-sm</div><div class="note">card · rest</div></div>
  <div class="cell"><div class="box" style="box-shadow:var(--shadow-md)"></div><div class="tok">--shadow-md</div><div class="note">card · hover</div></div>
  <div class="cell"><div class="box" style="box-shadow:var(--shadow-lg)"></div><div class="tok">--shadow-lg</div><div class="note">popover</div></div>
  <div class="cell"><div class="box" style="box-shadow:var(--shadow-xl)"></div><div class="tok">--shadow-xl</div><div class="note">modal</div></div>
</div>
</body></html>
