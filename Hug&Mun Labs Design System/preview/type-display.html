<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Type — display</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--cream-100);}
  .wrap{padding:24px 32px;}
  .row{display:flex;align-items:baseline;gap:16px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px dashed var(--border);}
  .row:last-child{border:none;}
  .specimen{font-family:var(--font-display);color:var(--ink-900);letter-spacing:-.02em;line-height:1;font-weight:600;}
  .meta{margin-left:auto;font-family:var(--font-mono);font-size:10px;color:var(--fg-subtle);letter-spacing:.05em;white-space:nowrap;}
</style>
</head><body>
<div class="wrap">
  <div class="row"><div class="specimen" style="font-size:60px">Thought &amp; memory</div><div class="meta">Fraunces · 60 / 600</div></div>
  <div class="row"><div class="specimen" style="font-size:38px;font-weight:500">Two ravens, one mind</div><div class="meta">Fraunces · 38 / 500</div></div>
  <div class="row"><div class="specimen" style="font-size:24px;font-weight:600">About the lab</div><div class="meta">Fraunces · 24 / 600</div></div>
</div>
</body></html>
