<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>hug&mun labs — website UI kit</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--cream-100); }
  #root { min-height: 100vh; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="../_shared.jsx"></script>
<script type="text/babel" src="./Header.jsx"></script>
<script type="text/babel" src="./Hero.jsx"></script>
<script type="text/babel" src="./ThoughtMemoryGrid.jsx"></script>
<script type="text/babel" src="./ResearchCard.jsx"></script>
<script type="text/babel" src="./Footer.jsx"></script>
<script type="text/babel" src="./Screens.jsx"></script>
<script type="text/babel">
  const { useState } = React;
  function App() {
    const [screen, setScreen] = useState(() => localStorage.getItem("hm-site-screen") || "home");
    const nav = (s) => { setScreen(s); localStorage.setItem("hm-site-screen", s); window.scrollTo(0, 0); };
    return (
      <div data-screen-label={`Website · ${screen}`}>
        <Header current={screen} onNav={nav} />
        <Screens screen={screen} onNav={nav} />
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
